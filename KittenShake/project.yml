name: KittenShake
options:
  bundleIdPrefix: com.kenzoragames
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  KittenShake:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KittenShake/Sources
      - path: KittenShake/Resources
        buildPhase: resources
      - path: KittenShake/Assets.xcassets
        buildPhase: resources
    info:
      path: KittenShake/Info.plist
      properties:
        CFBundleDisplayName: Kitten Shake
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "Kitten Shake needs camera access so you can take a photo to shake kittens onto."
        NSPhotoLibraryAddUsageDescription: "Kitten Shake needs permission to save your kitten creations to your photo library."
        NSPhotoLibraryUsageDescription: "Kitten Shake needs access to your photo library so you can pick a photo to shake kittens onto."
        LSApplicationQueriesSchemes:
          - instagram
        UIAppFonts:
          - FreckleFace-Regular.ttf
          - Fraunces-Black.ttf
          - Fraunces-Bold.ttf
          - Fraunces-SemiBold.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenzoragames.KittenShake
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: 7K9WY5T49S
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
schemes:
  KittenShake:
    build:
      targets:
        KittenShake: all
    run:
      config: Debug
      storeKitConfiguration: KittenShake/KittenShake.storekit
    archive:
      config: Release
